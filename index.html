<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REDDOX Clipora AI — Create Smarter. Clip Faster. Stand Out.</title>
    <meta name="description" content="AI-powered video clipping, automatic captioning, smart reframing, and browser-based video editing SaaS platform." />
    <meta property="og:title" content="REDDOX Clipora AI — Create Smarter. Clip Faster. Stand Out." />
    <meta property="og:description" content="Turn long videos into engaging short-form content with AI moment detection, customizable captions, smart reframing, and browser-based FFmpeg rendering." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('clipora-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0D0F17] dark:text-slate-100 antialiased selection:bg-purple-600/25 selection:text-purple-900 dark:selection:text-purple-200 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
